apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: stellar-pay
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          # Registry path must match what .github/workflows/deploy.yml pushes:
          # ${GITHUB_REPOSITORY,,} = ghcr.io/azurespay/azure-stellar-pay-hub.
          # The deploy job then overrides this with the commit-SHA tag via
          # `kustomize edit set image`; this default is what a manual
          # `kubectl apply -k` uses, and it used to name a repo that does not
          # exist (`ghcr.io/azure-stellar-pay-hub/api`).
          image: ghcr.io/azurespay/azure-stellar-pay-hub/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: stellar-pay-config }
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: stellar-pay-secrets, key: JWT_SECRET }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: stellar-pay-secrets, key: DATABASE_URL }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: stellar-pay-secrets, key: REDIS_URL }
            - name: WEBHOOK_SIGNING_SECRET
              valueFrom:
                secretKeyRef: { name: stellar-pay-secrets, key: WEBHOOK_SIGNING_SECRET }
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: stellar-pay
spec:
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: stellar-pay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
