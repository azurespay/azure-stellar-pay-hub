apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: stellar-pay
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          # Same registry path as deploy.yml pushes (see api.yaml).
          image: ghcr.io/azurespay/azure-stellar-pay-hub/web:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: stellar-pay
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: stellar-pay
  labels: { app: admin }
spec:
  replicas: 1
  selector:
    matchLabels: { app: admin }
  template:
    metadata:
      labels: { app: admin }
    spec:
      containers:
        - name: admin
          image: ghcr.io/azurespay/azure-stellar-pay-hub/admin:latest
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: stellar-pay
spec:
  selector: { app: admin }
  ports:
    - port: 80
      targetPort: 3000
