# DO NOT deploy with these placeholder values — generate real secrets first:
#
#   kubectl -n stellar-pay create secret generic stellar-pay-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL='postgresql://stellar_pay:<DB_PASSWORD>@postgres:5432/stellar_pay' \
#     --from-literal=REDIS_URL='redis://redis:6379' \
#     --from-literal=WEBHOOK_SIGNING_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 16)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# or edit the values below (base64-encoded) in a private fork. The Secret is
# included in the Kustomize bundle so `kubectl apply -k` resolves the
# secretKeyRefs in api.yaml / postgres.yaml; it must be replaced before the
# deployment is exposed to real traffic.
apiVersion: v1
kind: Secret
metadata:
  name: stellar-pay-secrets
  namespace: stellar-pay
type: Opaque
stringData:
  JWT_SECRET: change-me-jwt-secret-at-least-16-chars
  DATABASE_URL: postgresql://stellar_pay:change-me-db-password@postgres:5432/stellar_pay
  REDIS_URL: redis://redis:6379
  WEBHOOK_SIGNING_SECRET: change-me-webhook-signing-secret
  DB_PASSWORD: change-me-db-password
