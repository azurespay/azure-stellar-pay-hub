[workspace]
resolver = "2"
members = [
  "payment",
  "escrow",
  "treasury",
  "subscriptions",
  "invoices",
  "merchant",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/azure-stellar-pay-hub/stellar-pay"

[workspace.dependencies]
soroban-sdk = "21.7.1"

# Optimized wasm release profile (matches Soroban conventions).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
