packages:
  - 'apps/*'
  - '!apps/extension'
  - 'packages/*'

# pnpm 10: hoisted layout maximizes compatibility with Nx, NestJS and Next.js.
nodeLinker: hoisted

# pnpm 10: build scripts are allowed only for these dependencies.
# NOTE: this must live here (pnpm-workspace.yaml) — pnpm 10 ignores the
# "pnpm" field in package.json entirely.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - 'esbuild'
  - 'nx'
  - 'prisma'
  - 'sharp'
  - 'unrs-resolver'

# Transitive dependency overrides resolving known advisories where the patched
# version is semver-compatible with the depending package:
overrides:
  brace-expansion: ^5.0.9 # GHSA-rgw5-rvv9-x895 (nx > brace-expansion)
  nanoid: '>=3.3.18 <4' # GHSA-2v37-7h3g-55p8 (postcss > nanoid)
  deepmerge-ts: ^8.0.0 # GHSA-ggr8-5vv4-36mx (prisma > @prisma/config)
  qs: ^6.16.0 # qs bracket-key / isBuffer advisories (dev-only; patched >=6.16.0)
  toml: ^4.2.0 # toml-node recursion / prototype-pollution advisories (patched >=4.2.0)
  # @nestjs/platform-express pins multer to an exact 2.2.0, so the patched
  # release can only be reached through an override (advisories
  # GHSA-535w-7cp7-47q4, GHSA-wc9g-mqfw-jrwm, GHSA-qfvm-cv95-jqjf,
  # GHSA-qvfw-j98x-7q72; patched >=2.3.0).
  multer: ^2.3.0
  # nx pins smol-toml to an exact 1.6.1 (GHSA-7w5x-hrqm-74c2; patched >=1.7.1).
  smol-toml: ^1.7.1
  # js-yaml is pulled at two majors (jest and eslint chains) and each needs its
  # own patched floor (GHSA-2883-xcg3-v3hh).
  'js-yaml@<4': ^3.15.2
  'js-yaml@>=4': ^4.3.2

# Dependabot gates every lockfile update it performs behind a 3-day release-age
# window (`pnpm update … --config.minimumReleaseAge=4320`). A root-level update
# re-resolves the whole workspace, so if any transitive package released inside
# that window gets adopted, the gated pass rejects the lockfile the ungated pass
# just produced and the entire Dependabot group fails with an opaque
# `unknown_error`. @tybys/wasm-util was the package tripping it (0.10.4,
# 2026-09-13); it is reachable only through
# jest > jest-resolve > unrs-resolver > the wasm32-wasi binding, so it is never
# installed on a real platform and the cooldown buys nothing. pnpm's own error
# message points at this setting as the remedy.
minimumReleaseAgeExclude:
  - '@tybys/wasm-util'
