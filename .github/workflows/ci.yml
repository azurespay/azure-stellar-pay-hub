name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.32.1

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellar_pay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build packages
        # Packages resolve via gitignored dist output; build before typecheck/tests.
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prettier check
        run: pnpm format:check

      - name: Unit & integration tests
        run: pnpm test

      - name: API integration tests (tier 3, needs Postgres + Redis)
        run: pnpm db:push && pnpm --filter @stellar-pay/api test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_pay?schema=public
          REDIS_URL: redis://localhost:6379
          THROTTLER_BACKEND: memory # per-booted-app budgets keep suites deterministic
          JWT_SECRET: ci-test-secret-at-least-16-chars
          WEBHOOK_SIGNING_SECRET: ci-test-webhook-secret-16-chars
          ADMIN_PASSWORD: CiTestPass123!

      - name: Security scan (npm audit)
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Install uv for zizmor
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Security scan (zizmor)
        run: uvx zizmor .github/workflows

  build-contracts:
    name: Build Soroban contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32v1-none
      - name: Build contracts
        run: cargo build --manifest-path contracts/Cargo.toml --workspace --release --target wasm32v1-none
      - name: Test contracts
        run: cargo test --manifest-path contracts/Cargo.toml --workspace

  build-apps:
    name: Build apps & packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build packages
        run: pnpm build:packages
      - name: Build apps
        run: pnpm build:apps
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  testnet-e2e:
    # Live end-to-end verification on Stellar testnet: auth → fund → create →
    # sign → submit → on-chain confirm → realtime for BOTH the classic and the
    # Soroban payment routes, plus the escrow / treasury / invoice / merchant /
    # subscription contract integrations that the platform actually invokes.
    #
    # This is a REQUIRED gate: it runs on PRs and main pushes, and a failure
    # fails the build (no `continue-on-error`). Live testnet is inherently
    # flaky — Friendbot rate limits, ledger latency, RPC hiccups — so every flow
    # is retried once by the inline loop before the step is allowed to fail.
    # If the flake rate becomes disruptive, add `continue-on-error: true` here
    # to demote it back to advisory.
    name: Testnet E2E (live, required)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_pay?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-test-secret-at-least-16-chars
      WEBHOOK_SIGNING_SECRET: ci-e2e-webhook-secret-16-chars
      STELLAR_NETWORK: testnet
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      ADMIN_EMAIL: ci-e2e@test.dev
      ADMIN_PASSWORD: CiE2eTest123!
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellar_pay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build packages
        run: pnpm build:packages
      - name: Prepare schema
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_pay?schema=public
      - name: Build API (booted in-process by the E2E script)
        run: pnpm --filter @stellar-pay/api build
      - name: Payment lifecycle E2E — classic route (live testnet)
        run: |
          for attempt in 1 2; do
            echo "classic payment lifecycle — attempt $attempt/2"
            if node tests/e2e/auth-payment-flow.mjs; then exit 0; fi
            echo "::warning::classic payment E2E failed (attempt $attempt/2)"
            sleep 15
          done
          echo "::error::classic payment E2E failed after 2 attempts"
          exit 1

      - name: Payment lifecycle E2E — Soroban contract route (live testnet)
        env:
          E2E_CONTRACT: '1'
          PAYMENT_ROUTE: contract
          PAYMENT_CONTRACT_ASSETS: XLM
          CONTRACT_STELLAR_PAY_PAYMENT: CBDOGRJIOX46MEHIYRGU7BFKLT2OOPT7QIN7ZU53DH5WK7FF5QK7IN4Q
        run: |
          for attempt in 1 2; do
            echo "contract-route payment lifecycle — attempt $attempt/2"
            if node tests/e2e/auth-payment-flow.mjs; then exit 0; fi
            echo "::warning::contract-route payment E2E failed (attempt $attempt/2)"
            sleep 15
          done
          echo "::error::contract-route payment E2E failed after 2 attempts"
          exit 1

      - name: Contract integrations E2E — escrow/treasury/invoices/subscriptions/settlement (live testnet)
        env:
          CONTRACT_STELLAR_PAY_PAYMENT: CBDOGRJIOX46MEHIYRGU7BFKLT2OOPT7QIN7ZU53DH5WK7FF5QK7IN4Q
          CONTRACT_STELLAR_PAY_ESCROW: CDWVUTCME6JSATWKKWIFVBEO4NAZSJCCX2ECNRQN3L33W65EFT3AMUEY
          CONTRACT_STELLAR_PAY_INVOICES: CB3XBXQUY4LHSFPWJ4XZL6T7A2ITNMBWMCTT2QOS6LB7PF7RPJBTVDHZ
          CONTRACT_STELLAR_PAY_SUBSCRIPTIONS: CCMQF6EB5DT6HKWGOB5BTRMD6Q66D5MVBQQN5HOK3565WHATXINOLBNI
          CONTRACT_STELLAR_PAY_TREASURY: CCKWXDASGA7W3KWMEOEXYWMV5RVDLV2WGEJOHO3SYHKMXHZ3X4UWRMKZ
          CONTRACT_STELLAR_PAY_MERCHANT: CDNQTYF4XSOPNY6ID6MHUROAC2BNIQTYWHJYVGXWMU5WFA5AOQGDQUEU
        run: |
          for attempt in 1 2; do
            echo "contract integrations — attempt $attempt/2"
            if node tests/e2e/contracts-flow.mjs; then exit 0; fi
            echo "::warning::contract integrations E2E failed (attempt $attempt/2)"
            sleep 15
          done
          echo "::error::contract integrations E2E failed after 2 attempts"
          exit 1
