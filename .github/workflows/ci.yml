name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.32.1

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellar_pay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build packages
        # Packages resolve via gitignored dist output; build before typecheck/tests.
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prettier check
        run: pnpm format:check

      - name: Unit & integration tests
        run: pnpm test

      - name: API integration tests (tier 3, needs Postgres + Redis)
        run: pnpm db:push && pnpm --filter @stellar-pay/api test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_pay?schema=public
          REDIS_URL: redis://localhost:6379
          THROTTLER_BACKEND: memory # per-booted-app budgets keep suites deterministic
          JWT_SECRET: ci-test-secret-at-least-16-chars
          WEBHOOK_SIGNING_SECRET: ci-test-webhook-secret-16-chars
          ADMIN_PASSWORD: CiTestPass123!

      - name: Security scan (npm audit)
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Install uv for zizmor
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Security scan (zizmor)
        run: uvx zizmor .github/workflows

  build-contracts:
    name: Build Soroban contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32v1-none
      - name: Build contracts
        run: cargo build --manifest-path contracts/Cargo.toml --workspace --release --target wasm32v1-none
      - name: Test contracts
        run: cargo test --manifest-path contracts/Cargo.toml --workspace

  build-apps:
    name: Build apps & packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build packages
        run: pnpm build:packages
      - name: Build apps
        run: pnpm build:apps
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  testnet-e2e:
    # Live end-to-end verification on Stellar testnet (auth → fund → create →
    # sign → submit → on-chain confirm → realtime). Runs on main pushes only
    # (Friendbot/ledger flakiness makes it unsuitable for PR gating) and is
    # non-blocking so a transient testnet outage never breaks CI — failures
    # still surface in the run summary for triage.
    name: Testnet E2E (live, main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellar_pay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build packages
        run: pnpm build:packages
      - name: Prepare schema
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_pay?schema=public
      - name: Build API (booted in-process by the E2E script)
        run: pnpm --filter @stellar-pay/api build
      - name: Run live testnet payment-lifecycle E2E
        run: node tests/e2e/auth-payment-flow.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_pay?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-test-secret-at-least-16-chars
          STELLAR_NETWORK: testnet
          ADMIN_EMAIL: ci-e2e@test.dev
          ADMIN_PASSWORD: CiE2eTest123!
