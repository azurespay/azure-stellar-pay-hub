name: Deploy to Railway

# ── Railway environment variables ──────────────────────────────────────────
# Set these in the Railway dashboard (Service > Variables):
#
#   Required:
#     DATABASE_URL          PostgreSQL connection string
#     JWT_SECRET            Min 16 chars, used to sign access/refresh tokens
#     REDIS_URL             Redis connection string (e.g. redis://host:6379)
#     ADMIN_PASSWORD        Initial admin account password (min 8 chars)
#     WEBHOOK_SIGNING_SECRET Min 16 chars, for signing merchant webhook payloads
#
#   Optional (defaults provided):
#     STELLAR_NETWORK       'testnet' | 'public' (default: testnet)
#     CORS_ORIGINS          Comma-separated allowed origins
#     NOTIFICATIONS_EMAIL_ENABLED 'true' | 'false'
#     SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD
#     IPFS_PROVIDER         'local' | 'pinata' | 'web3'
#
# ── GitHub Environment secrets & vars ──────────────────────────────────────
# In repo Settings > Environments > railway, add:
#   Secrets:  RAILWAY_TOKEN       (PROJECT-scoped token from Railway, created
#                                  at railway.com/project/<ID>/settings — an
#                                  account/API token will fail with "Project
#                                  Token not found")
#   Vars:     RAILWAY_API_URL     (e.g. https://stellar-pay-api.up.railway.app)
#             RAILWAY_PROJECT_ID  (from railway.com/project/<ID>; optional when
#                                  RAILWAY_TOKEN is project-scoped, since the
#                                  CLI derives the project from the token)
#
# When the secret/vars above are absent or still hold placeholder text, the
# deploy step skips with a warning instead of failing the pipeline.
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'infrastructure/docker/api.Dockerfile'
      - 'infrastructure/docker/start.sh'
      - 'railway.json'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    environment: railway
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Railway credentials
        id: creds
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning title=Railway deploy skipped::RAILWAY_TOKEN secret is not set in the 'railway' environment. Add a project-scoped token at railway.com/project/<ID>/settings to enable deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$RAILWAY_PROJECT_ID" ] && \
               echo "$RAILWAY_PROJECT_ID" | grep -q "project/<ID>"; then
            echo "::warning title=Railway deploy skipped::RAILWAY_PROJECT_ID variable still holds the placeholder text. Set it to the real project ID from railway.com/project/<ID> (or remove it — a project-scoped token carries the project)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via Railway CLI
        if: steps.creds.outputs.skip != 'true'
        run: |
          npx -y @railway/cli@3 up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}

      - name: Smoke test
        if: steps.creds.outputs.skip != 'true'
        env:
          RAILWAY_URL: ${{ vars.RAILWAY_API_URL }}
        run: |
          if [ -z "$RAILWAY_URL" ]; then
            echo "⚠️  RAILWAY_API_URL variable not set — skipping smoke test"
            exit 0
          fi

          echo "Waiting for deployment to become healthy (up to 120s)..."
          for i in $(seq 1 24); do
            if curl -sf "${RAILWAY_URL}/api/health" > /dev/null 2>&1; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/24 — not ready yet, waiting 5s..."
            sleep 5
          done

          echo "❌ Health check failed after 24 attempts"
          exit 1
