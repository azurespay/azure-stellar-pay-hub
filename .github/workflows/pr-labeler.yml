name: PR Auto-Labeler

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  label:
    name: Label PR from conventional commit prefix
    runs-on: ubuntu-latest
    # Scoped to the job: a workflow-level write grant makes every job in the file
    # write-capable as far as OpenSSF Scorecard's Token-Permissions check is
    # concerned. `contents: read` is still required for actions/checkout.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Apply labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Map conventional commit prefix → label based on CONTRIBUTING.md
          declare -A PREFIX_MAP=(
            ["feat:"]="enhancement"
            ["fix:"]="bug"
            ["chore:"]="chore"
            ["docs:"]="documentation"
            ["refactor:"]="refactor"
            ["test:"]="test"
            ["ci:"]="ci"
            ["style:"]="style"
          )

          TITLE="$PR_TITLE"
          LABELS_TO_ADD=""

          for prefix in "${!PREFIX_MAP[@]}"; do
            if [[ "$TITLE" == "$prefix"* ]]; then
              LABELS_TO_ADD="${PREFIX_MAP[$prefix]}"
              break
            fi
          done

          if [[ -z "$LABELS_TO_ADD" ]]; then
            echo "No conventional commit prefix found in PR title: '$TITLE'"
            echo "Skipping label application."
            exit 0
          fi

          echo "Detected prefix → applying label: $LABELS_TO_ADD"
          gh pr edit "$PR_NUMBER" --add-label "$LABELS_TO_ADD" --repo "$GITHUB_REPOSITORY"
          echo "Label '$LABELS_TO_ADD' applied to PR #$PR_NUMBER"
