name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain health — branch
# protection, pinned dependencies, token permissions, dangerous workflow
# patterns, static analysis, dependency updates and more.
#
# It is a *report*, not a gate: results land in the code-scanning dashboard and,
# because this repository is public, in the public Scorecard API. Accepted
# findings and the reasoning behind them are recorded in SECURITY.md, so the
# score can be read against what the project has consciously decided rather than
# treated as a verdict on its own.

on:
  # Re-score when a branch protection rule changes, so the Branch-Protection
  # check cannot go stale.
  branch_protection_rule:
  # Weekly, so a regression cannot sit unnoticed between pushes to main.
  schedule:
    - cron: '27 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload the SARIF result to the code-scanning dashboard.
      security-events: write
      # Mint the OIDC token that signs the result published to the OpenSSF API.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repository, so the score is published at
          # https://scorecard.dev/viewer/?uri=github.com/azurespay/azure-stellar-pay-hub
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
